    <main>

        <section class="page-hero">

            <div class="container">

                <!--<p class="eyebrow">
                    06 — Contact
                </p> -->

                <h1>
                    Me <span>contacter</span>
                </h1>

                <p>
                    Un formulaire simple pour me transmettre un message.
                    Ouverte aux opportunités de Stage, d'alternance et de collaboration.
                </p>
                
                

            </div>

        </section>

        <section class="section">

            <div class="container">

                <div class="card mx-auto" style="max-width:850px">

                    <form id="contactForm">

    <div class="row g-3">

        
        <div class="col-12">
            <label class="form-label">Nom</label>
            <input id="name"
                class="form-control subject-light"
                required
                placeholder="Votre nom">
        </div>

        
        <div class="col-12">
            <label class="form-label">E-mail</label>
            <input id="email"
                type="email"
                class="form-control subject-light"
                required
                placeholder="votre@email.com">
        </div>

        
        <div class="col-12">
            <label class="form-label">Sujet</label>
            <input id="subject"
                class="form-control subject-light"
                required
                placeholder="Objet du message">
        </div>

        
        <div class="col-12">
            <label class="form-label">Message</label>
            <textarea id="message"
                    rows="7"
                    class="form-control subject-light"
                    required
                    placeholder="Votre message..."></textarea>
        </div>

        
        <div class="col-12">
            <div class="contact-socials">

                
                <a href="https://www.linkedin.com/in/ravie-lououadi-b728ab338/?lipi=urn%3Ali%3Apage%3Ad_flagship3_profile_view_base_contact_details%3BudJpmzX9RoOLER35d6%2BdkA%3D%3D"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="LinkedIn">
                    <i class="bi bi-linkedin"></i>
                </a>

            
                <a href="https://github.com/RavieLououadi"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="GitHub">
                    <i class="bi bi-github"></i>
                </a>

                
                <a href="mailto:ravie.lououadi.fr@gmail.com"
                aria-label="E-mail">
                    <i class="bi bi-envelope"></i>
                </a>

            </div>
        </div>

        <div class="col-12">
            <div class="g-recaptcha"
                data-sitekey="6Lf2YNgtAAAAANquuuicfUg3Tbc6y4PPXp6lY75j">
            </div>
        </div>
        
        <div class="col-12">
            <button class="btn btn-orange">
                Envoyer le message
                <i class="bi bi-send"></i>
            </button>

            <p id="status" class="muted mt-3"></p>
        </div>

    </div>

</form>
                </div>

            </div>
